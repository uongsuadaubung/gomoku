<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Wood Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Black Stone 3D Gradient -->
    <radialGradient id="blackStone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- White Stone 3D Gradient -->
    <radialGradient id="whiteStone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Mini Board Surface -->
  <rect x="72" y="72" width="368" height="368" rx="48" fill="url(#boardGrad)" filter="url(#shadow)"/>

  <!-- Grid Lines -->
  <g stroke="#451a03" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <!-- Horizontal lines -->
    <line x1="120" y1="140" x2="392" y2="140"/>
    <line x1="120" y1="200" x2="392" y2="200"/>
    <line x1="120" y1="260" x2="392" y2="260"/>
    <line x1="120" y1="320" x2="392" y2="320"/>
    <line x1="120" y1="380" x2="392" y2="380"/>

    <!-- Vertical lines -->
    <line x1="140" y1="120" x2="140" y2="392"/>
    <line x1="200" y1="120" x2="200" y2="392"/>
    <line x1="260" y1="120" x2="260" y2="392"/>
    <line x1="320" y1="120" x2="320" y2="392"/>
    <line x1="380" y1="120" x2="380" y2="392"/>
  </g>

  <!-- Tianyuan star point -->
  <circle cx="260" cy="260" r="7" fill="#451a03"/>
  <circle cx="200" cy="200" r="5" fill="#451a03"/>
  <circle cx="320" cy="320" r="5" fill="#451a03"/>

  <!-- Black Stone (Bottom Left) -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="320" r="54" fill="url(#blackStone)"/>
    <ellipse cx="184" cy="300" rx="20" ry="12" fill="#ffffff" opacity="0.25" transform="rotate(-30 184 300)"/>
  </g>

  <!-- White Stone (Top Right) -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="200" r="54" fill="url(#whiteStone)"/>
    <ellipse cx="304" cy="180" rx="22" ry="14" fill="#ffffff" opacity="0.75" transform="rotate(-30 304 180)"/>
  </g>

  <!-- Golden Crown / Star Badge at center connecting the stones -->
  <g transform="translate(260, 260) scale(1.1)" filter="url(#glowGold)">
    <path d="M0 -22 Q3 -6 18 -18 Q6 -3 22 0 Q6 3 18 18 Q3 6 0 22 Q-3 6 -18 18 Q-6 3 -22 0 Q-6 -3 -18 -18 Q-3 -6 0 -22Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>
</svg>